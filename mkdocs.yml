site_name: Tzamot Developer Docs
site_description: Developer documentation for Tzamot — a braids & hair styling appointment management PWA.
repo_url: https://github.com/hthr240/tzamot
repo_name: hthr240/tzamot
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  anchors: warn
  links:
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search

nav:
  - Home:
      - index.md
      - Onboarding Checklist: onboarding.md
      - Decision Log (ADRs): decisions.md
      - Glossary: glossary.md
  - Product:
      - product/index.md
      - Client Features: product/client-features.md
      - Admin Features: product/admin-features.md
      - Business Rules: product/business-rules.md
      - Out of Scope (Future): product/out-of-scope.md
  - Architecture:
      - architecture/index.md
      - Environments: architecture/environments.md
      - CI/CD Pipeline: architecture/cicd.md
      - Request Flow: architecture/request-flow.md
      - Backend: architecture/backend.md
      - Frontend (PWA): architecture/frontend.md
      - Data Model: architecture/data-model.md
      - Booking Algorithm: architecture/booking-algorithm.md
      - Deployment & Hosting: architecture/deployment.md
      - Cost Analysis: architecture/cost.md
  - Development:
      - development/index.md
      - Local Setup: development/local-setup.md
      - Git Workflow & Code Review: development/workflow.md
      - CI Pipeline: development/ci-pipeline.md
      - Task Management: development/task-management.md
      - Logging: development/logging.md
      - Coding Standards: development/coding-standards.md
      - Project Structure: development/project-structure.md
  - Roadmap:
      - roadmap/index.md
      - Sprint 1 — Foundation & Local Dev: roadmap/sprint-1.md
      - Sprint 2 — Admin Core: roadmap/sprint-2.md
      - Sprint 3 — Booking Engine: roadmap/sprint-3.md
      - Sprint 4 — PWA & Launch: roadmap/sprint-4.md
