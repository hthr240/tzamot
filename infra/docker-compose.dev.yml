name: tzamot-dev

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tzamot
      POSTGRES_PASSWORD: tzamot
      POSTGRES_DB: tzamot
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tzamot -d tzamot"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  pg_dev_data:
